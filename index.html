<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#205b49"><link rel="manifest" href="manifest.webmanifest"><title>FitHer</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f1;color:#183d32;font:16px system-ui}header{background:#205b49;color:white;padding:24px;border-radius:0 0 25px 25px}main{max-width:700px;margin:auto;padding:16px 16px 100px}h1{margin:6px 0}article{background:white;border-radius:16px;padding:16px;margin:12px 0;border:1px solid #dce7dd}button,input,select{font:inherit;padding:10px;border:1px solid #cbdcd1;border-radius:10px;background:white;color:inherit}button{cursor:pointer}button.on{background:#205b49;color:white}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;gap:5px;padding:10px}nav button{flex:1;max-width:160px}small{color:#64796d}header small{color:#cfe8d7}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row strong{flex:1}input[type=number]{width:90px}progress{width:100%;accent-color:#205b49}label{display:block;padding:8px 0}input[type=checkbox]{accent-color:#205b49}h2{font-size:21px}h3{font-size:17px;margin:4px 0 10px}</style><header><small>YOUR PERSONAL FITNESS JOURNEY</small><h1>FitHer</h1>Stronger every day · 12 weeks</header><main id="app"></main><nav id="nav"></nav><script>
const plan=[['Monday · Upper A',[['Dumbbell bench press',3,'10–12'],['Lat pulldown',3,'10–12'],['Shoulder press',2,'10–12'],['Cable row',3,'10–12'],['Lateral raise',2,'12–15'],['Triceps pushdown',2,'12–15']]],['Tuesday · Full A',[['Glute bridge',3,'12'],['Romanian deadlift',3,'10–12'],['Chair squat (pain-free)',2,'10'],['Chest press',2,'10–12'],['Lat pulldown',2,'10–12'],['Plank',3,'20–40 sec']]],['Thursday · Upper B',[['Incline dumbbell press',3,'10–12'],['Cable row',3,'10–12'],['Lateral raise',3,'12–15'],['Face pull',2,'12–15'],['Biceps curl',2,'10–12'],['Hammer curl',2,'10–12']]],['Saturday · Full B',[['Leg press (pain-free)',2,'10–12'],['Seated leg curl',3,'10–12'],['Hip thrust',3,'10–12'],['Chest press',2,'10–12'],['Lat pulldown',2,'10–12'],['Reverse crunch',3,'12–15']]]];
const menu=[['Eggs, oats, milk and banana','Rice, chicken, dhal and greens','Curd and fruit','Chapati, fish and vegetables'],['String hoppers, egg and dhal','Rice, fish and beans','Milk and chickpeas','Chicken, sweet potato and salad'],['Oats, milk and eggs','Rice, chicken and vegetables','Curd and fruit','Rice, dhal and fish'],['Egg sandwich and milk','Rice, fish, dhal and greens','Fruit and roasted chickpeas','Chapati and chicken curry'],['Eggs, bread and fruit','Rice, chicken and vegetables','Curd and nuts','Fish, rice and dhal'],['Hoppers, egg and dhal','Rice, fish and vegetables','Milk and banana','Chapati and chickpea curry'],['Oats, milk and fruit','Rice, chicken, dhal and greens','Curd and fruit','Fish, sweet potato and vegetables']];
let s={week:1,checks:{},weights:{},meals:{},water:{},measure:{},protein:100,cal:1650};try{Object.assign(s,JSON.parse(localStorage.getItem('fither')||'{}'))}catch(e){}let tab='Home',day=0,mealday=(new Date().getDay()+6)%7;const today=()=>new Date().toDateString(),save=()=>{try{localStorage.setItem('fither',JSON.stringify(s))}catch(e){}};const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');const total=plan.flatMap(x=>x[1]).reduce((a,e)=>a+e[1],0),count=w=>Object.keys(s.checks).filter(k=>k.startsWith(w+':')&&s.checks[k]).length;let deadline=0;
function render(){let h='<div class="row"><strong>Week '+s.week+' of 12</strong><select id="week">'+Array.from({length:12},(_,i)=>'<option '+(s.week===i+1?'selected':'')+'>'+ (i+1)+'</option>').join('')+'</select></div>';if(tab==='Home'){h+='<article><h2>Weekly progress</h2><progress max="'+total+'" value="'+count(s.week)+'"></progress>'+count(s.week)+' / '+total+' sets</article>'+plan.map((p,i)=>'<article class="row"><strong>'+p[0]+'</strong><button data-day="'+i+'">Start</button></article>').join('')+'<article>Rest Wednesday, Friday and Sunday. Choose comfortable weights and stop painful movements.</article>'}if(tab==='Workout'){h+='<article class="row">'+plan.map((p,i)=>'<button data-day="'+i+'" class="'+(day===i?'on':'')+'">'+p[0].slice(0,3)+'</button>').join('')+'</article><h2>'+plan[day][0]+'</h2><article><strong id="timer">Rest timer</strong><div class="row"><button data-timer="60">60 sec</button><button data-timer="90">90 sec</button><button data-timer="0">Stop</button></div></article>'+plan[day][1].map((e,i)=>{let k=s.week+':'+day+':'+i;return '<article><h3>'+e[0]+'</h3><small>'+e[1]+' sets × '+e[2]+'</small><div class="row"><input aria-label="Weight kg" type="number" min="0" step=".5" placeholder="kg" data-weight="'+k+'" value="'+esc(s.weights[k])+'">'+Array.from({length:e[1]},(_,j)=>'<button data-set="'+k+':'+j+'" class="'+(s.checks[k+':'+j]?'on':'')+'">Set '+(j+1)+'</button>').join('')+'</div></article>'}).join('')+'<small>Warm up 5–10 minutes. Leave 2–3 reps in reserve. If knee pain persists, seek a physiotherapist.</small>'}if(tab==='Diet'){h+='<article><h2>Daily nutrition</h2><label>Energy estimate <input type="number" min="0" data-target="cal" value="'+esc(s.cal)+'"> kcal</label><label>Protein estimate <input type="number" min="0" data-target="protein" value="'+esc(s.protein)+'"> g</label><small>Editable starting estimates, not strict limits. Eat enough to recover; increase intake if hungry or fatigued.</small></article><h2>7-day Sri Lankan meal plan</h2><div class="row">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((x,i)=>'<button data-menu="'+i+'" class="'+(i===mealday?'on':'')+'">'+x+'</button>').join('')+'</div>'+menu[mealday].map((m,i)=>{let k=today()+':'+mealday+':'+i;return '<article><label><input type="checkbox" data-meal="'+k+'" '+(s.meals[k]?'checked':'')+'> <b>'+['Breakfast','Lunch','Snack','Dinner'][i]+'</b></label>'+m+'</article>'}).join('')+'<article><h3>Portion guide</h3>Lunch and dinner: a palm of protein, a serving of rice or other starch, vegetables and some healthy fats. Add snacks as needed. Include calcium-rich foods and iron-rich foods.</article><article><h3>Water tracker</h3><p>'+(s.water[today()]||0)+' glasses today</p><button data-water="1">+ Glass</button> <button data-water="-1">− Glass</button></article>'}if(tab==='Progress'){h+='<h2>12-week consistency</h2>'+Array.from({length:12},(_,i)=>'<article>Week '+(i+1)+'<progress max="'+total+'" value="'+count(i+1)+'"></progress></article>').join('')+'<article><h3>Optional weekly measurements</h3>'+['Weight kg','Waist cm','Hip cm'].map(x=>'<label>'+x+' <input type="number" step=".1" min="0" data-measure="'+s.week+':'+x+'" value="'+esc(s.measure[s.week+':'+x])+'"></label>').join('')+'</article><button id="backup">Export backup</button><small> Progress is stored on this device, not GitHub.</small>'}document.querySelector('#app').innerHTML=h;document.querySelector('#nav').innerHTML=['Home','Workout','Diet','Progress'].map(x=>'<button data-tab="'+x+'" class="'+(tab===x?'on':'')+'">'+x+'</button>').join('')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.tab)tab=d.tab;if(d.day!==undefined){day=+d.day;tab='Workout'}if(d.set)s.checks[d.set]=!s.checks[d.set];if(d.menu!==undefined)mealday=+d.menu;if(d.water)s.water[today()]=Math.max(0,(s.water[today()]||0)+ +d.water);if(d.timer)deadline=+d.timer?Date.now()+ +d.timer*1000:0;if(b.id==='backup'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='fither-backup.json';a.click();URL.revokeObjectURL(a.href)}save();render()});document.addEventListener('change',e=>{let t=e.target,d=t.dataset;if(t.id==='week')s.week=+t.value;if(d.weight)s.weights[d.weight]=t.value;if(d.meal)s.meals[d.meal]=t.checked;if(d.measure)s.measure[d.measure]=t.value;if(d.target)s[d.target]=+t.value;save();if(t.id==='week')render()});setInterval(()=>{let t=document.querySelector('#timer');if(t)t.textContent=deadline?Math.max(0,Math.ceil((deadline-Date.now())/1000))+' seconds remaining':'Rest timer'},250);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
